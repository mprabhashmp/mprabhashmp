<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="50" y="18" width="900" height="4" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="19.5" width="900" height="1" fill="url(#g)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
